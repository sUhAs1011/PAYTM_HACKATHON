name: parchapay

services:
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - path: .env
        required: false
    volumes:
      - ./backend/static/crops:/app/static/crops
      - ./backend/static/audio:/app/static/audio
      # CIS golden fixture: mounted read-only because the backend build
      # context excludes the repo root (same pattern as the frontend mount).
      - ./contracts:/contracts:ro
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; s=socket.create_connection(('127.0.0.1', 8000), 2); s.close()"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    volumes:
      # Read-only shared contract definitions (CIS): mounted at /contracts so
      # the tsconfig "@contracts/*" paths ("../contracts/..." relative to
      # frontend/) resolve inside the container exactly as they do for
      # host-mode `ng serve`. Compose paths are relative to this compose file.
      - ./contracts:/contracts:ro
    ports:
      - "4200:4200"
    depends_on:
      api:
        condition: service_healthy
        restart: true
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4200').then(()=>process.exit(0)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped
